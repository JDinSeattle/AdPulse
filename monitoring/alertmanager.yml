route:
  receiver: local
  group_by: [alertname, job]
  group_wait: 15s
  group_interval: 2m
  repeat_interval: 2h
receivers:
  - name: local
inhibit_rules:
  - source_matchers: [severity="critical"]
    target_matchers: [severity="warning"]
    equal: [job]
# Add an explicitly configured webhook receiver for external notifications.
# The local default only exposes grouped firing/resolved state in Alertmanager.
