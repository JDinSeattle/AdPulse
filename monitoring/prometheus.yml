global:
  scrape_interval: 10s
  evaluation_interval: 10s
rule_files: [/etc/prometheus/alerts.yml]
alerting:
  alertmanagers:
    - static_configs:
        - targets: [alertmanager:9093]
scrape_configs:
  - job_name: collector
    static_configs:
      - targets: [collector:8088]
  - job_name: workers
    static_configs:
      - targets: [sink:9101, archive:9101]
  - job_name: governance
    static_configs:
      - targets: [api:8080]
  - job_name: flink
    static_configs:
      - targets: [jobmanager:9249, taskmanager-1:9249, taskmanager-2:9249]
