[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "adpulse"
version = "0.2.0"
description = "广告行为实时数仓与质量治理平台"
requires-python = ">=3.11"
dependencies = [
  "jsonschema==4.23.0", "fastapi==0.141.1", "starlette==1.6.0", "uvicorn==0.34.2",
  "confluent-kafka==2.10.0", "prometheus-client==0.21.1",
  "requests==2.32.3", "boto3==1.38.13", "psycopg[binary]==3.2.9"
]

[project.optional-dependencies]
test = ["pytest==8.3.5", "httpx==0.28.1", "ruff==0.11.8"]

[project.scripts]
adpulse = "adpulse.cli:main"

[tool.setuptools.packages.find]
include = ["adpulse*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
