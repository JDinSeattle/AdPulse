name: adpulse

x-python: &python
  image: adpulse-python:0.3.0
  build:
    context: ..
    dockerfile: deployment/Dockerfile.python

x-env: &environment
  KAFKA_BOOTSTRAP_SERVERS: kafka:9092
  CLICKHOUSE_URL: http://clickhouse:8123
  CLICKHOUSE_USER: adpulse
  CLICKHOUSE_PASSWORD: adpulse-local
  POSTGRES_DSN: postgresql://adpulse:adpulse-local@postgres:5432/adpulse
  S3_ENDPOINT: http://minio:9000
  AWS_ACCESS_KEY_ID: adpulse
  AWS_SECRET_ACCESS_KEY: adpulse-local-storage
  S3_BUCKET: adpulse-archive
  RELEASE_ID: live-v1
  FLINK_CLEAN_PARALLELISM: ${ADPULSE_CLEAN_PARALLELISM:-2}
  FLINK_ATTRIBUTION_PARALLELISM: ${ADPULSE_ATTRIBUTION_PARALLELISM:-2}

x-flink: &flink
  image: adpulse-flink:0.3.0
  build:
    context: ..
    dockerfile: deployment/Dockerfile.flink
  environment:
    <<: *environment
    FLINK_PROPERTIES: |
      jobmanager.rpc.address: jobmanager
      jobmanager.memory.process.size: 1536m
      taskmanager.memory.process.size: ${ADPULSE_TM_MEMORY:-2048m}
      taskmanager.numberOfTaskSlots: 4
      parallelism.default: 2
      state.savepoints.dir: file:///opt/flink/state/savepoints
      execution.checkpointing.interval: 10s
      metrics.reporter.prom.factory.class: org.apache.flink.metrics.prometheus.PrometheusReporterFactory
      metrics.reporter.prom.port: 9249
      rest.flamegraph.enabled: true
  volumes:
    - flink-state:/opt/flink/state
  depends_on:
    state-init: {condition: service_completed_successfully}
    kafka: {condition: service_healthy}

services:
  kafka:
    image: apache/kafka:3.9.0
    ports: ["127.0.0.1:19092:19092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,EXTERNAL://:19092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:19092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_MAX_TIMEOUT_MS: 900000
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_HEAP_OPTS: -Xms512m -Xmx512m
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    volumes: ["kafka-data:/var/lib/kafka/data"]
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null"]
      interval: 10s
      timeout: 10s
      retries: 18
  postgres:
    image: postgres:16.8
    command: ["postgres", "-c", "wal_level=logical", "-c", "max_replication_slots=4", "-c", "max_wal_senders=4", "-c", "max_slot_wal_keep_size=1024MB"]
    environment:
      POSTGRES_USER: adpulse
      POSTGRES_PASSWORD: adpulse-local
      POSTGRES_DB: adpulse
    ports: ["127.0.0.1:15432:5432"]
    volumes: ["postgres-data:/var/lib/postgresql/data", "./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U adpulse -d adpulse"]
      interval: 5s
      timeout: 5s
      retries: 20
  clickhouse:
    image: clickhouse/clickhouse-server:26.3.32.14
    environment:
      CLICKHOUSE_USER: adpulse
      CLICKHOUSE_PASSWORD: adpulse-local
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    ports: ["127.0.0.1:18123:8123"]
    volumes: ["clickhouse-data:/var/lib/clickhouse", "./clickhouse/init.sql:/docker-entrypoint-initdb.d/init.sql:ro"]
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --user adpulse --password adpulse-local --query 'SELECT 1'"]
      interval: 5s
      timeout: 5s
      retries: 30
    ulimits:
      nofile: {soft: 262144, hard: 262144}
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: adpulse
      MINIO_ROOT_PASSWORD: adpulse-local-storage
    ports: ["127.0.0.1:19000:9000", "127.0.0.1:19001:9001"]
    volumes: ["archive-data:/data"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 20
  connect:
    image: quay.io/debezium/connect:3.0.8.Final
    environment:
      BOOTSTRAP_SERVERS: kafka:9092
      GROUP_ID: adpulse-connect
      CONFIG_STORAGE_TOPIC: adpulse.connect.configs
      OFFSET_STORAGE_TOPIC: adpulse.connect.offsets
      STATUS_STORAGE_TOPIC: adpulse.connect.status
      CONFIG_STORAGE_REPLICATION_FACTOR: 1
      OFFSET_STORAGE_REPLICATION_FACTOR: 1
      STATUS_STORAGE_REPLICATION_FACTOR: 1
      HEAP_OPTS: -Xms256m -Xmx512m
    ports: ["127.0.0.1:18083:8083"]
    depends_on:
      kafka: {condition: service_healthy}
      postgres: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8083/connectors"]
      interval: 10s
      timeout: 5s
      retries: 30
  state-init:
    image: flink:1.20.5-scala_2.12-java17
    user: root
    entrypoint: ["/bin/sh", "-c", "mkdir -p /opt/flink/state/checkpoints /opt/flink/state/savepoints && chown -R flink:flink /opt/flink/state"]
    volumes: ["flink-state:/opt/flink/state"]
  jobmanager:
    <<: *flink
    command: jobmanager
    ports: ["127.0.0.1:18081:8081"]
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8081/overview"]
      interval: 5s
      timeout: 5s
      retries: 30
  taskmanager-1:
    <<: *flink
    command: taskmanager
  taskmanager-2:
    <<: *flink
    command: taskmanager
  bootstrap:
    <<: *python
    command: python /app/deployment/bootstrap.py
    environment:
      <<: *environment
      CLEAN_SAVEPOINT: ${CLEAN_SAVEPOINT:-}
      ATTRIBUTION_SAVEPOINT: ${ATTRIBUTION_SAVEPOINT:-}
    volumes: ["../flink-jobs/target/adpulse-jobs.jar:/app/jobs.jar:ro"]
    depends_on:
      kafka: {condition: service_healthy}
      clickhouse: {condition: service_healthy}
      minio: {condition: service_healthy}
      connect: {condition: service_healthy}
      jobmanager: {condition: service_healthy}
  collector:
    <<: *python
    command: uvicorn adpulse.collector:app --host 0.0.0.0 --port 8088
    environment:
      <<: *environment
      COLLECTOR_TRANSACTIONAL_ID: adpulse-collector-1
    ports: ["127.0.0.1:8088:8088"]
    depends_on:
      bootstrap: {condition: service_completed_successfully}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8088/health')"]
      interval: 5s
      timeout: 5s
      retries: 20
  sink:
    <<: *python
    command: python -m adpulse.worker sink
    environment:
      <<: *environment
      # Amortize per-batch conflict checks and synchronous inserts at measured load.
      # consume() still returns partial batches after its one-second poll timeout.
      BATCH_SIZE: "2000"
    depends_on:
      bootstrap: {condition: service_completed_successfully}
    restart: unless-stopped
  archive:
    <<: *python
    command: python -m adpulse.worker archive
    environment: *environment
    depends_on:
      bootstrap: {condition: service_completed_successfully}
    restart: unless-stopped
  api:
    <<: *python
    command: uvicorn adpulse.api:app --host 0.0.0.0 --port 8080
    environment:
      <<: *environment
      ADPULSE_CURSOR_SECRET: ${ADPULSE_CURSOR_SECRET:-adpulse-local-cursor-key-change-for-shared-deployments}
      ADPULSE_INSPECTION_DIR: /inspection
      ADPULSE_QUERY_CONCURRENCY: "4"
    volumes: ["inspection-data:/inspection:ro"]
    ports: ["127.0.0.1:8080:8080"]
    depends_on:
      bootstrap: {condition: service_completed_successfully}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 10s
      timeout: 5s
      retries: 20
  inspection-init:
    <<: *python
    user: root
    command: ["sh", "-c", "mkdir -p /inspection && chown 10001:10001 /inspection"]
    volumes: ["inspection-data:/inspection"]
  inspection-coverage:
    <<: *python
    command: python -m adpulse.inspection coverage
    environment:
      <<: *environment
      ADPULSE_INSPECTION_DIR: /inspection
    volumes: ["inspection-data:/inspection"]
    mem_limit: 1g
    memswap_limit: 1g
    cpus: 1
    depends_on:
      inspection-init: {condition: service_completed_successfully}
      bootstrap: {condition: service_completed_successfully}
    restart: unless-stopped
  inspection-metrics:
    <<: *python
    command: python -m adpulse.inspection metrics
    environment:
      <<: *environment
      ADPULSE_INSPECTION_DIR: /inspection
    volumes: ["inspection-data:/inspection"]
    mem_limit: 512m
    memswap_limit: 512m
    cpus: 1
    depends_on:
      inspection-init: {condition: service_completed_successfully}
      bootstrap: {condition: service_completed_successfully}
    restart: unless-stopped
  prometheus:
    image: prom/prometheus:v3.3.0
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=7d"]
    ports: ["127.0.0.1:19090:9090"]
    volumes: ["../monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro", "../monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro", "prometheus-data:/prometheus"]
  alertmanager:
    image: prom/alertmanager:v0.28.1
    ports: ["127.0.0.1:19093:9093"]
    volumes: ["../monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro"]
  grafana:
    image: grafana/grafana:11.6.1
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: adpulse-local
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports: ["127.0.0.1:13000:3000"]
    volumes: ["grafana-data:/var/lib/grafana", "../monitoring/grafana/provisioning:/etc/grafana/provisioning:ro", "../monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro"]

volumes:
  kafka-data:
  postgres-data:
  clickhouse-data:
    name: ${CLICKHOUSE_DATA_VOLUME:-adpulse_clickhouse-data-v26}
  archive-data:
  flink-state:
  prometheus-data:
  grafana-data:
  inspection-data:
