# Isolated local three-process failure lab. NOT three physical hosts or production HA.
name: adpulse-quorum
x-broker: &broker
  image: apache/kafka:3.9.0
  healthcheck:
    test: [CMD-SHELL, '/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null']
    interval: 5s
    timeout: 10s
    retries: 30
x-broker-env: &broker-env
  KAFKA_PROCESS_ROLES: broker,controller
  KAFKA_LISTENERS: PLAINTEXT://:9092,EXTERNAL://:19092,CONTROLLER://:9093
  KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
  KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
  KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
  KAFKA_CONTROLLER_QUORUM_VOTERS: 1@broker-1:9093,2@broker-2:9093,3@broker-3:9093
  KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
  KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
  KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
  KAFKA_TRANSACTION_MAX_TIMEOUT_MS: 900000
  KAFKA_MIN_INSYNC_REPLICAS: 2
  KAFKA_DEFAULT_REPLICATION_FACTOR: 3
  KAFKA_UNCLEAN_LEADER_ELECTION_ENABLE: 'false'
  KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'false'
  KAFKA_LOG_DIRS: /var/lib/kafka/data
  KAFKA_HEAP_OPTS: -Xms512m -Xmx512m
  CLUSTER_ID: YWRwdWxzZS1xdW9ydW0tMQ
services:
  broker-1:
    <<: *broker
    environment:
      <<: *broker-env
      KAFKA_NODE_ID: 1
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://broker-1:9092,EXTERNAL://localhost:29092
    ports: ['127.0.0.1:29092:19092']
    volumes: [broker-1:/var/lib/kafka/data]
  broker-2:
    <<: *broker
    environment:
      <<: *broker-env
      KAFKA_NODE_ID: 2
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://broker-2:9092,EXTERNAL://localhost:29093
    ports: ['127.0.0.1:29093:19092']
    volumes: [broker-2:/var/lib/kafka/data]
  broker-3:
    <<: *broker
    environment:
      <<: *broker-env
      KAFKA_NODE_ID: 3
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://broker-3:9092,EXTERNAL://localhost:29094
    ports: ['127.0.0.1:29094:19092']
    volumes: [broker-3:/var/lib/kafka/data]
  collector:
    image: adpulse-python:0.2.0
    command: uvicorn adpulse.collector:app --host 0.0.0.0 --port 8088
    environment:
      KAFKA_BOOTSTRAP_SERVERS: broker-1:9092,broker-2:9092,broker-3:9092
      TOPIC_PREFIX: adpulse-quorum
      COLLECTOR_TRANSACTIONAL_ID: adpulse-quorum-collector
    ports: ['127.0.0.1:28088:8088']
    depends_on:
      broker-1: {condition: service_healthy}
      broker-2: {condition: service_healthy}
      broker-3: {condition: service_healthy}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8088/health')"]
      interval: 5s
      timeout: 5s
      retries: 20
volumes:
  broker-1:
  broker-2:
  broker-3:
